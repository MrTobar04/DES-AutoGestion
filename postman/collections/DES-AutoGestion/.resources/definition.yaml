$kind: collection
description: |-
  Colección para el proyecto DES-AutoGestion — arquitectura de microservicios con API Gateway Ocelot.

  Servicios incluidos:
  - **API Gateway** (puerto 5000): Enrutamiento Ocelot con rate limiting (10 req/min)
  - **API Productos** (puerto 5001): Catálogo de productos con caché Redis
  - **API Libros** (puerto 5002): Catálogo de libros y manuales técnicos con caché Redis
  - **API Vehículos** (puerto 5003): Flotilla de vehículos con Identity + JWT

  Autenticación: Bearer JWT (obtenido desde POST /api/auth/login en API Vehículos)
variables:
  gateway_url: http://localhost:5000
  productos_url: http://localhost:5001
  libros_url: http://localhost:5002
  vehiculos_url: http://localhost:5003
  jwt_token: ""
