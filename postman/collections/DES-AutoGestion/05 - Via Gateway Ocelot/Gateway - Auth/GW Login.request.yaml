$kind: http-request
name: 'GW Login'
method: POST
url: '{{gateway_url}}/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "juan.perez@ejemplo.com",
      "password": "Password123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const response = pm.response.json();
      if (response.token) {
          pm.collectionVariables.set("jwt_token", response.token);
          console.log("JWT token guardado en variable de colección: jwt_token");
      }
