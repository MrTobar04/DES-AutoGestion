$kind: http-request
name: 'Crear Vehículo'
method: POST
url: '{{vehiculos_url}}/api/vehiculos'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{jwt_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "modeloId": 1,
      "marca": "Toyota",
      "modelo": "Corolla",
      "anio": 2023,
      "precio": 22000.00,
      "placa": "P123-456"
    }
