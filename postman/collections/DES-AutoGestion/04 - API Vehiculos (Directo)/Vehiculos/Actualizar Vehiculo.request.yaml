$kind: http-request
name: 'Actualizar Vehículo'
method: PUT
url: '{{vehiculos_url}}/api/vehiculos/:id'
order: 4000
pathVariables:
  - key: id
    value: '1'
headers:
  - key: Authorization
    value: 'Bearer {{jwt_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "modeloId": 1,
      "marca": "Toyota",
      "modelo": "Corolla",
      "anio": 2024,
      "precio": 23500.00,
      "placa": "P123-456"
    }
